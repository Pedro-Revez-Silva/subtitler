dry_run: true
state_path: /config/subtitler-state.json
temp_dir: /tmp

tools:
  ffmpeg: ffmpeg
  ffprobe: ffprobe

sonarr:
  url: http://sonarr:8989
  api_key: ${SONARR_API_KEY}

radarr:
  url: http://radarr:7878
  api_key: ${RADARR_API_KEY}

openai:
  api_key: ${OPENAI_API_KEY}
  # Timestamped SRT output currently uses whisper-1. Keep this unless the
  # transcription backend gains native subtitle timestamps.
  transcription_model: whisper-1
  translation_model: gpt-4o-mini
  max_chunk_seconds: 1200
  context: ""

telemetry:
  # Enabled by default. Sends one anonymous installation event, then records it in the state file.
  enabled: true
  # Leave empty to use the built-in maintainer Sentry project DSN.
  sentry_dsn: ${SENTRY_DSN}
  environment: production
  release: ""

subtitles:
  required_languages:
    - en
    - pt-PT
  # Prefer English audio, then fall back to the default audio track.
  source_audio_languages:
    - en
    - auto
  # Generate this source subtitle first, then translate it to the other required languages.
  source_subtitle_language: en
  # Deprecated compatibility option. Use source_audio_languages instead.
  audio_language: en
  # missing_only: generate only absent target subtitles
  # generated_only: remove external subtitles and regenerate target languages
  # force: regenerate target languages every scan
  strategy: missing_only
  cleanup:
    # keep, quarantine, or delete. Use quarantine first, delete once trusted.
    external_subtitles: keep
  embedded:
    # ignore keeps generation audio-first. extract reuses matching embedded subtitle tracks.
    action: ignore
    title: official
  output:
    format: srt
    title: subtitler
  protected_suffixes:
    - forced
  path_mappings: []
  # Example if ARR containers and this container see different media roots:
  # path_mappings:
  #   - from: /movies
  #     to: /media/movies

processing:
  scan_interval: 30m
  concurrency: 1
  retry_failed_after: 24h
  max_attempts: 3
  # 0 means unlimited. Start low to control OpenAI spend during first library runs.
  max_jobs_per_scan: 1
