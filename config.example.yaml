dry_run: true
state_path: /data/subtitler-state.json
temp_dir: /data/tmp

tools:
  ffmpeg: ffmpeg
  ffprobe: ffprobe

# Optional persistent ownership engine. Its Docker image includes the local
# tools; native installations also need manager/requirements.txt.
management:
  enabled: false
  state_dir: /data/ownership
  providers_file: /data/providers.json
  quarantine_dir: /media/agent-backups/subtitler
  verify_words: true
  verification_model: base
  # A stronger local check for inconclusive samples; 'none' disables escalation.
  verification_fallback_model: small
  local_transcription: true
  prune_embedded: true
  min_free_gb: 50
  paid_fallback: false
  media_cache_gb: 5 # bounded reusable audio/subtitle/word-sample cache on the state disk
  paid_daily_usd: 1.0
  # File acquisition/verification and last-resort generation run independently.
  queues:
    file_workers: 2
    transcription_workers: 1
    worker_threads: 2
    batch_size: 16
    adaptive: true
    poll_seconds: 5
    min_memory_gb: 2
    max_load_per_cpu: 0.85
    max_io_pressure: 20 # fallback when per-disk counters are unavailable
    max_disk_utilization: 85
    max_disk_await_ms: 50

sonarr:
  url: http://sonarr:8989
  api_key: ${SONARR_API_KEY}

radarr:
  url: http://radarr:7878
  api_key: ${RADARR_API_KEY}

openai:
  api_key: ${OPENAI_API_KEY}
  # Timestamped SRT output currently uses whisper-1. Keep this unless the
  # transcription backend gains native subtitle timestamps.
  transcription_model: whisper-1
  translation_model: gpt-4o-mini
  # OpenAI transcription uploads are capped at 25 MB. Subtitler encodes mono
  # 64 kbps MP3 chunks and keeps a 24 MB safety ceiling.
  max_chunk_seconds: 1200
  max_chunk_bytes: 24000000
  # Retries only the failed chunk when validation detects likely hallucination.
  chunk_retries: 2
  context: ""

telemetry:
  # Enabled by default. Sends one anonymous installation event, then records it in the state file.
  enabled: true
  # Leave empty to use the built-in maintainer Sentry project DSN.
  sentry_dsn: ${SENTRY_DSN}
  environment: production
  release: ""

subtitles:
  # Managed languages drive acquisition, verification, generation and cleanup.
  # Use ISO tags: [fr, es, de], [pt-BR], or a regional/script tag such as zh-Hant.
  # Generic pt accepts any Portuguese variant; pt-PT requires Portugal evidence.
  required_languages:
    - en
    - pt-PT
  # Prefer English audio, then fall back to the default audio track.
  source_audio_languages:
    - en
    - auto
  # Generate this source subtitle first, then translate it to the other required languages.
  source_subtitle_language: en
  # Deprecated compatibility option. Use source_audio_languages instead.
  audio_language: en
  # missing_only: generate only absent target subtitles
  # generated_only: remove external subtitles and regenerate target languages
  # force: regenerate target languages every scan
  strategy: missing_only
  cleanup:
    # keep, quarantine, or delete. Use quarantine first, delete once trusted.
    external_subtitles: keep
  embedded:
    # ignore keeps generation audio-first. extract reuses matching embedded subtitle tracks.
    action: ignore
    title: official
  output:
    format: srt
    title: subtitler
  protected_suffixes:
    - forced
  path_mappings: []
  # Example if ARR containers and this container see different media roots:
  # path_mappings:
  #   - from: /movies
  #     to: /media/movies

processing:
  scan_interval: 30m
  concurrency: 1
  retry_failed_after: 24h
  max_attempts: 3
  # Ownership uses queue batches; legacy generation treats zero as unlimited.
  max_jobs_per_scan: 0 # Use the queue batch size; a positive value caps each queue cycle.
