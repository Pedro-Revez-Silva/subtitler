version: 2
updates:
  - package-ecosystem: pip
    directory: /manager
    # faster-whisper 1.2.1 still passes metadata_errors to av.open.
    # Revisit this bound when upgrading faster-whisper to a compatible release.
    ignore:
      - dependency-name: av
        versions: [">=19"]
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Lisbon
    groups:
      subtitle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Lisbon
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Lisbon
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Lisbon
