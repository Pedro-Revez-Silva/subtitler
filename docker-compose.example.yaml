services:
  subtitler:
    image: ghcr.io/pedro-revez-silva/subtitler:latest
    container_name: subtitler
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SUBTITLER_TELEMETRY: ${SUBTITLER_TELEMETRY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./config.yaml:/etc/subtitler/config.yaml:ro
      - ./data:/data
      # Mount media using the same paths that Sonarr/Radarr report when possible.
      # Example for a host library at /mnt/media:
      - /mnt/media:/mnt/media
    command: ["daemon", "-config", "/etc/subtitler/config.yaml"]
